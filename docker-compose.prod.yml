services:
  api:
    image: ${DOCKER_IMAGE}
    ports:
      - "${API_PORT:-3001}:${API_PORT:-3001}"
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID}
      - WEBAUTHN_ORIGIN=${WEBAUTHN_ORIGIN}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - APPLE_CLIENT_ID=${APPLE_CLIENT_ID}
      - APPLE_TEAM_ID=${APPLE_TEAM_ID}
      - APPLE_KEY_ID=${APPLE_KEY_ID}
      - APPLE_PRIVATE_KEY=${APPLE_PRIVATE_KEY}
      - APPLE_APP_BUNDLE_IDENTIFIER=${APPLE_APP_BUNDLE_IDENTIFIER}
      # Hardcoded: the encrypted env must not be able to select mock sealing
      # keys (TC-966).
      - TEE_MODE=production
      - RESEND_API_KEY=${RESEND_API_KEY}
      - API_PORT=${API_PORT}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - OAUTH_DYNAMIC_CLIENT_REGISTRATION=${OAUTH_DYNAMIC_CLIENT_REGISTRATION:-true}
      - OAUTH_VALID_AUDIENCES=${OAUTH_VALID_AUDIENCES:-https://mcp.tinycloud.xyz/mcp}
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - INTERNAL_METRICS_TOKEN=${INTERNAL_METRICS_TOKEN}
      - OPENKEY_METRICS_READ_TOKEN=${OPENKEY_METRICS_READ_TOKEN:-}
      - NODE_STATS_URL=${NODE_STATS_URL:-}
      - NODE_STATS_READ_TOKEN=${NODE_STATS_READ_TOKEN:-}
      - SCOREBOARD_EXCLUDE_USER_IDS=${SCOREBOARD_EXCLUDE_USER_IDS:-}
      - SCOREBOARD_EXCLUDE_CLIENT_IDS=${SCOREBOARD_EXCLUDE_CLIENT_IDS:-}
      # Cloudflare Turnstile server-side verification for new-account sign-up.
      # Unset = new sign-ups pause (fail closed); sign-in is unaffected.
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY:-}
      # Public hostname the Turnstile widget runs on. Unset = hostname not checked.
      - TURNSTILE_EXPECTED_HOSTNAME=${TURNSTILE_EXPECTED_HOSTNAME:-}
      # QA registration exemption (server-checked, rotatable). Unset = disabled.
      - OPENKEY_QA_REGISTRATION_SECRET=${OPENKEY_QA_REGISTRATION_SECRET:-}
      - OPENKEY_QA_REGISTRATION_SECRET_PREVIOUS=${OPENKEY_QA_REGISTRATION_SECRET_PREVIOUS:-}
      # Runtime QA account registry (JSON, deploy-time secret). Unset = no exemptions.
      - TEST_ACCOUNT_REGISTRY_JSON=${TEST_ACCOUNT_REGISTRY_JSON:-}
    restart: unless-stopped
    healthcheck:
      # Keep this aligned with the API's configurable listener. `$$` defers
      # expansion to the container so the probe exercises the running API.
      test: ["CMD-SHELL", "wget -q -T 5 -O /dev/null http://127.0.0.1:$${API_PORT:-3001}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  dstack-ingress:
    image: dstacktee/dstack-ingress:20250924@sha256:40429d78060ef3066b5f93676bf3ba7c2e9ac47d4648440febfdda558aed4b32
    ports:
      - "443:443"
    depends_on:
      - api
    environment:
      - DOMAIN=api.openkey.so
      - TARGET_ENDPOINT=http://api:${API_PORT:-3001}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      # CNAME target the ingress publishes for DOMAIN. Must not start with `_`:
      # Android's resolver (bionic res_hnok) rejects a CNAME target whose first
      # label is `_`, so `_.<gateway>` is unresolvable on Android (TC-513).
      # `gateway.<gateway>` is the target Phala Cloud advertises (gateway.cname)
      # and upstream dstack-ingress documents; routing still uses SNI + the
      # _dstack-app-address TXT record, so TLS stays end-to-end into the CVM.
      - GATEWAY_DOMAIN=gateway.${DSTACK_GATEWAY_DOMAIN}
      - CERTBOT_EMAIL=${CERTBOT_EMAIL}
      - SET_CAA=true
      - DNS_PROVIDER=cloudflare
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - cert-data:/etc/letsencrypt
    restart: unless-stopped

volumes:
  cert-data:
