services:
  api:
    image: ${DOCKER_IMAGE}
    depends_on:
      - key-recovery
    # TC-1012: no host port. The ingress reaches api over the compose network;
    # publishing it would expose the app via the Phala gateway, bypassing ingress.
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - key-recovery:/run/key-recovery
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID}
      - WEBAUTHN_ORIGIN=${WEBAUTHN_ORIGIN}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      # Apple web sign-in is on (TC-1188); offered only when the Apple
      # credentials are set in the encrypted env.
      - APPLE_SIGN_IN_ENABLED=true
      - APPLE_NATIVE_SIGN_IN_ENABLED=true
      - APPLE_CLIENT_ID=so.openkey.signin
      - APPLE_TEAM_ID=R4QVKA785H
      - APPLE_KEY_ID=US5Z53MQVQ
      - APPLE_PRIVATE_KEY=${APPLE_PRIVATE_KEY}
      - APPLE_APP_BUNDLE_IDENTIFIERS=${APPLE_APP_BUNDLE_IDENTIFIERS}
      # Primary App ID for Apple server-to-server notifications; the webhook is
      # not found while Apple sign-in is disabled (TC-1231).
      - APPLE_WEBHOOK_AUDIENCE=so.openkey
      # Hardcoded: the encrypted env must not be able to select mock sealing
      # keys (TC-966).
      - TEE_MODE=production
      - RESEND_API_KEY=${RESEND_API_KEY}
      - API_PORT=${API_PORT}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - APPROVAL_RESULT_RETENTION_SECONDS=600
      - TINYCLOUD_BOOTSTRAP_SYNC_BUDGET_MS=8000
      - OAUTH_DYNAMIC_CLIENT_REGISTRATION=${OAUTH_DYNAMIC_CLIENT_REGISTRATION:-true}
      - OAUTH_VALID_AUDIENCES=${OAUTH_VALID_AUDIENCES:-https://mcp.tinycloud.xyz/mcp}
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - INTERNAL_METRICS_TOKEN=${INTERNAL_METRICS_TOKEN}
      - OPENKEY_METRICS_READ_TOKEN=${OPENKEY_METRICS_READ_TOKEN:-}
      - NODE_STATS_URL=${NODE_STATS_URL:-}
      - NODE_STATS_READ_TOKEN=${NODE_STATS_READ_TOKEN:-}
      - SCOREBOARD_EXCLUSIONS=${SCOREBOARD_EXCLUSIONS:-}
      - SCOREBOARD_EXCLUDE_USER_IDS=${SCOREBOARD_EXCLUDE_USER_IDS:-}
      - SCOREBOARD_EXCLUDE_ADDRESSES=${SCOREBOARD_EXCLUDE_ADDRESSES:-}
      - SCOREBOARD_DISPOSABLE_DOMAINS=${SCOREBOARD_DISPOSABLE_DOMAINS:-}
      - SCOREBOARD_EXCLUDE_CLIENT_IDS=${SCOREBOARD_EXCLUDE_CLIENT_IDS:-}
      - SCOREBOARD_EXCLUDE_EMAIL_PREFIXES=${SCOREBOARD_EXCLUDE_EMAIL_PREFIXES:-}
      - OPENKEY_NATIVE_RENEW_DISABLED=${OPENKEY_NATIVE_RENEW_DISABLED:-}
      # Renewal leases: public settings, written here rather than sealed, so turning them on or off is a
      # reviewed compose change and never touches the sealed environment. The DIDs are the production node's,
      # as https://node.tinycloud.xyz/.well-known/tinycloud/node-keys advertises them (nodeDid, renewerDid).
      - OPENKEY_RENEWAL_LEASES=enabled
      - OPENKEY_RENEWAL_NODE_DID=did:key:z6MkjHi79SMX4doJyo2w7jDTM6Fa7iX6EVZWXNbJ6RzBm3Wi
      - OPENKEY_RENEWAL_RENEWER_DID=did:key:z6MkgWpiYdQV8pAr3dtHLdQsoZR3wF5wsS7fpkzAuX6q1PZj
      # TC-3554 — one-time re-seal at first boot. Every value is a literal, so the
      # compose hash attests it (never ${VAR}, which resolves from the sealed environment).
      # The API re-seals every key sealed under the pre-move Phala root (epoch 0, read through the
      # key-recovery sidecar) under the current root, and listens only after every row is current
      # or on the bounded quarantine list. Any other failure ends the process. It ran at the first
      # boot on 7f053ae1. Remove OPENKEY_LEGACY_RESEAL (and key-recovery below) only after the
      # quarantine list has been reviewed.
      # KMS_ROOT_PUBKEY is the epoch-0 root, approved by Bobbie from the offline recovery and two
      # pre-move records. CANARY_ADDRESS is an internal test account (MEAL) whose key was sealed before
      # the move: its unsealed key must derive exactly this address, or the API does not start.
      - OPENKEY_LEGACY_RESEAL=enabled
      - OPENKEY_LEGACY_SIDECAR_SOCKET=/run/key-recovery/kr.sock
      - OPENKEY_LEGACY_ROOT_EPOCH=0
      - OPENKEY_LEGACY_KMS_ROOT_PUBKEY=0334c76e0c3f52ec64cbf9bbf5c910c272330166fd656c0a86bb330963e46910e1
      - OPENKEY_LEGACY_APP_ID=b7d6e87778f73904a8f5fd26e4d0f1d1310234be
      - OPENKEY_LEGACY_CANARY_ADDRESS=0x92a13CF5e915b6a4c70EC7FF68277ad9670B922C
    restart: unless-stopped
    healthcheck:
      # Keep this aligned with the API's configurable listener. `$$` defers
      # expansion to the container so the probe exercises the running API.
      test: ["CMD-SHELL", "wget -q -T 5 -O /dev/null http://127.0.0.1:$${API_PORT:-3001}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # TC-3554: the first boot re-seals every pre-move key before the API listens, so /health
      # is unreachable for as long as that takes. Failures inside start_period do not count.
      start_period: 900s

  # TC-3554 — Phala's dstack-key-recovery (cosign-verified digest, same as the
  # node's) fetches the epoch-0 key from the KMS and serves it on a unix socket for openkey-api's
  # own verifier (packages/tee legacy-root). No ports and no TCP listener (--no-addr); the socket
  # lives on a volume only this service and api mount. The api image runs as root, so the sidecar
  # runs as root:root and its 0660 socket is reachable by api. From host-shared it sees only
  # .appkeys.json and .sys-config.json, never the decrypted env. Its answers are not logged.
  key-recovery:
    image: ghcr.io/dstack-tee/dstack-key-recovery@sha256:26803eb7eb34f69f367d7ebc0b4abc31f35caad5e58213de77a91dddcd2d0b6b
    restart: unless-stopped
    user: "0:0"
    command: ["serve", "--no-addr", "--socket", "/run/key-recovery/kr.sock"]
    # The quote goes through the host's vsock QGS; Docker's default seccomp profile blocks AF_VSOCK.
    security_opt:
      - seccomp=unconfined
    environment:
      DSTACK_CCEL_FILE: /ccel.bin
    volumes:
      - key-recovery:/run/key-recovery
      - /dstack/.host-shared/.appkeys.json:/dstack/.host-shared/.appkeys.json:ro
      - /dstack/.host-shared/.sys-config.json:/dstack/.host-shared/.sys-config.json:ro
      - /run/log/dstack:/run/log/dstack:ro
      - /sys/firmware/acpi/tables/data/CCEL:/ccel.bin:ro
      - /etc/tdx-attest.conf:/etc/tdx-attest.conf:ro
    devices:
      - /dev/tdx_guest:/dev/tdx_guest
      - /dev/vsock:/dev/vsock
    logging:
      driver: none

  dstack-ingress:
    image: dstacktee/dstack-ingress:20250924@sha256:40429d78060ef3066b5f93676bf3ba7c2e9ac47d4648440febfdda558aed4b32
    ports:
      - "443:443"
    depends_on:
      - api
    environment:
      - DOMAIN=api.openkey.so
      - TARGET_ENDPOINT=http://api:${API_PORT:-3001}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      # CNAME target the ingress publishes for DOMAIN. Must not start with `_`:
      # Android's resolver (bionic res_hnok) rejects a CNAME target whose first
      # label is `_`, so `_.<gateway>` is unresolvable on Android (TC-513).
      # `gateway.<gateway>` is the target Phala Cloud advertises (gateway.cname)
      # and upstream dstack-ingress documents; routing still uses SNI + the
      # _dstack-app-address TXT record, so TLS stays end-to-end into the CVM.
      - GATEWAY_DOMAIN=gateway.${DSTACK_GATEWAY_DOMAIN}
      - CERTBOT_EMAIL=${CERTBOT_EMAIL}
      - SET_CAA=true
      - DNS_PROVIDER=cloudflare
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - cert-data:/etc/letsencrypt
    restart: unless-stopped

volumes:
  cert-data:
  key-recovery:
