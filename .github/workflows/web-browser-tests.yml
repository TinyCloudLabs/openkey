# Runs the apps/web Playwright browser specs (chromium, and webkit for the SDK handshake) against
# the SvelteKit dev server that tests/browser/playwright.config.ts starts (TC-2120). No secrets,
# database or network services: every API call in the specs is routed in the browser.
#
# NOT a required check yet: make it required once a few main runs are clean (a flake is retried).
#
# No `paths:` filter on the triggers: the workflow always runs and reports. The "Decide whether the
# change touches the web app" step decides whether the real steps execute, and it fails OPEN: only a
# clean `git diff` with no relevant path skips them (.github/scripts/web-browser-relevance.sh).
#
# The job result is decided by .github/scripts/web-browser-summary.mjs from Playwright's JSON report
# AND its exit status: it fails on a failure that is NOT a known red (.github/web-browser-known-reds.json),
# on a nonzero exit status the report does not fully explain, and on an incomplete report (no tests,
# fewer than minTests, a project or spec file with no tests, stats that disagree with the tests, a
# skipped test that is not listed). A test that failed and passed on its retry is a flake: reported,
# not a failure.
#
# KNOWN REDS: none today (the list in .github/web-browser-known-reds.json is empty). A spec that is
#   red on main can be listed there, with its diagnosis, until it is fixed; the job then prints it as
#   a known red, and says "known red now passes: delete it from the list" once it passes.
name: Web browser tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: web-browser-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web-browser-tests:
    name: Web browser specs
    # Pinned: ubuntu-latest is Ubuntu 26.04, where Playwright cannot install Chromium. Unpin per TC-3071.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      # Full history: the relevance step diffs the pull request's base against the merge commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test the workflow's own scripts
        run: node --test .github/scripts/web-browser-relevance.test.mjs .github/scripts/web-browser-summary.test.mjs

      - name: Decide whether the change touches the web app
        id: relevance
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
        run: |
          out="$(bash .github/scripts/web-browser-relevance.sh)" || out=$'relevant=true\nreason=the relevance script failed, so the specs run'
          echo "$out" >> "$GITHUB_OUTPUT"
          echo "Web browser specs: $(sed -n 's/^reason=//p' <<< "$out")" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Bun
        if: steps.relevance.outputs.relevant == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        if: steps.relevance.outputs.relevant == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        if: steps.relevance.outputs.relevant == 'true'
        run: bun install --frozen-lockfile --ignore-scripts

      # The signing pages load @openkey/capability-review from its dist/, and the SDK handshake spec
      # serves packages/sdk/dist/index.mjs (built with its @openkey/core and @openkey/types).
      - name: Build packages
        if: steps.relevance.outputs.relevant == 'true'
        run: bun run build --filter @openkey/capability-review --filter @openkey/sdk

      - name: Read the Playwright version
        id: playwright-version
        if: steps.relevance.outputs.relevant == 'true'
        working-directory: apps/web
        run: echo "version=$(bunx playwright --version | sed 's/^Version //')" >> "$GITHUB_OUTPUT"

      # The browser download is the slow, variable part of this job, so it is cached by the Playwright
      # version, not by the whole lockfile (any dependency change would otherwise miss the cache). It is
      # restored and saved separately: a job that fails (a red spec) skips a plain cache step's save.
      - name: Restore Playwright browsers
        id: playwright-cache
        if: steps.relevance.outputs.relevant == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # The apt packages `--with-deps` installs (about 150 for webkit) are the other slow part: they are
      # downloaded from the runner's Ubuntu mirror on every run, which is what timed out (TC-3298). apt's
      # download directory is moved to ~/.cache/apt-archives and cached, so a warm run installs them from
      # disk. The key carries the ISO week so the archive is refreshed weekly as the mirror moves on, and a
      # restore of an older week (restore-keys) still saves a fresh archive. apt does NOT verify a cached
      # .deb against its package index (it accepts an existing archive file by size), so the safety of this
      # cache rests on cache scoping alone: a pull request writes only its own refs/pull/N/merge scope, and
      # only a push to main writes the scope that every branch reads. Do not restore this cache in a job that
      # holds secrets or publishes, and do not widen the scope.
      - name: Read the cache week
        id: cache-week
        if: steps.relevance.outputs.relevant == 'true'
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Restore apt packages
        id: apt-cache
        if: steps.relevance.outputs.relevant == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/apt-archives
          key: apt-${{ runner.os }}-ubuntu-24.04-playwright-${{ steps.playwright-version.outputs.version }}-${{ steps.cache-week.outputs.week }}
          restore-keys: |
            apt-${{ runner.os }}-ubuntu-24.04-playwright-${{ steps.playwright-version.outputs.version }}-

      # `--with-deps` runs apt, and a runner's Ubuntu mirror is sometimes slow. apt gets short connection
      # timeouts, retries and a wait for the dpkg lock; its downloads go to the cached archive directory and
      # are kept; a failed install is retried (never killed halfway: a killed apt keeps the lock). The step's
      # time limit is a backstop: a cold run on a slow mirror took more than the old 15 minutes ten times in
      # the last 40 runs (TC-3241, TC-3298).
      - name: Install Playwright browsers
        id: playwright-install
        if: steps.relevance.outputs.relevant == 'true'
        timeout-minutes: 25
        working-directory: apps/web
        run: |
          mkdir -p "$HOME/.cache/apt-archives/partial"
          printf 'Acquire::Retries "3";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nDPkg::Lock::Timeout "180";\nDir::Cache::archives "%s/.cache/apt-archives/";\nAPT::Keep-Downloaded-Packages "true";\nAPT::Sandbox::User "root";\n' "$HOME" | sudo tee /etc/apt/apt.conf.d/99-ci-timeouts > /dev/null
          restored=$(find "$HOME/.cache/apt-archives" -maxdepth 1 -name '*.deb' | wc -l)
          for attempt in 1 2 3; do
            if bunx playwright install --with-deps chromium webkit; then
              kept=$(find "$HOME/.cache/apt-archives" -maxdepth 1 -name '*.deb' | wc -l)
              echo "Playwright install: browser cache hit=${{ steps.playwright-cache.outputs.cache-hit }}, apt cache hit=${{ steps.apt-cache.outputs.cache-hit }}, apt packages from cache before install: $restored, in the archive after: $kept" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Playwright install attempt $attempt failed" >&2
            sleep 15
          done
          exit 1

      # The apt archive is saved only after the packages are installed (a killed apt leaves a partial
      # archive), owned by the runner user so the cache action can read it. apt itself ran as root.
      - name: Make the apt archive readable for the cache
        if: steps.playwright-install.conclusion == 'success' && steps.apt-cache.outputs.cache-hit != 'true'
        run: |
          sudo rm -f "$HOME/.cache/apt-archives/lock"
          sudo chown -R "$(id -u):$(id -g)" "$HOME/.cache/apt-archives"

      - name: Save apt packages
        if: steps.playwright-install.conclusion == 'success' && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/apt-archives
          key: apt-${{ runner.os }}-ubuntu-24.04-playwright-${{ steps.playwright-version.outputs.version }}-${{ steps.cache-week.outputs.week }}

      - name: Save Playwright browsers
        if: steps.playwright-install.conclusion == 'success' && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # CI=true makes the config retry a failed test once. The step ends green but KEEPS Playwright's
      # exit status in `exit_code`: the summary step below reads it with the JSON report and decides the
      # result (a nonzero status that the report does not fully explain fails the job).
      #
      # The dev server listens on `localhost`, which a runner resolves to ::1 first, while the SDK
      # handshake spec loads the widget from http://127.0.0.1:5779. IPv4 first makes `localhost`
      # mean 127.0.0.1 (as on a developer machine), so both addresses reach the server.
      - name: Run the browser specs
        id: suite
        if: steps.relevance.outputs.relevant == 'true'
        working-directory: apps/web
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/playwright-report.json
        run: |
          set +e
          bunx playwright test --config tests/browser/playwright.config.ts --reporter=list,json
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          echo "Playwright exited with status $status; the summary step decides the result."
          exit 0

      - name: Summarize, and fail unless the report is complete and every failure is a known red
        if: always() && steps.suite.conclusion != 'skipped'
        env:
          PLAYWRIGHT_EXIT_CODE: ${{ steps.suite.outputs.exit_code }}
        run: |
          set -o pipefail
          node .github/scripts/web-browser-summary.mjs "$RUNNER_TEMP/playwright-report.json" .github/web-browser-known-reds.json \
            --exit-code "$PLAYWRIGHT_EXIT_CODE" --specs-dir apps/web/tests/browser | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the report and the failure context
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: web-browser-tests-report
          path: |
            ${{ runner.temp }}/playwright-report.json
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7
