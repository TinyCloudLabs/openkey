name: Backfill Session Expiry

# One-time step after the 30-day web session cap (#362) is deployed (TC-2101).
# `apply` backs up and caps the expiry of sessions that are more than 30 days past
# their creation; `rollback` puts the backed-up expiry back. Both run in one
# transaction and print counts only (no session ids, tokens or connection strings).
# The backup table is left in place by both; remove it by hand when it is not needed.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'apply: back up and cap. rollback: restore from the backup.'
        required: true
        type: choice
        options:
          - apply
          - rollback
      confirm:
        description: 'Type the same word as mode (apply or rollback) to confirm'
        required: true

permissions:
  contents: read

jobs:
  backfill:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Restore Bun dependency cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Backfill session expiry
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKFILL_MODE: ${{ inputs.mode }}
          BACKFILL_CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret not set" >&2
            exit 1
          fi
          if [ "$BACKFILL_CONFIRM" != "$BACKFILL_MODE" ]; then
            echo "confirm must equal mode" >&2
            exit 1
          fi
          bun install --frozen-lockfile
          bun node_modules/.bin/prisma generate --schema=./packages/db/prisma/schema.prisma
          bun run scripts/ci-backfill-session-expiry.ts --mode "$BACKFILL_MODE"
