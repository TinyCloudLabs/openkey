name: Republish Current Versions

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Packages to republish (comma-separated, or "all")'
        type: string
        default: 'all'
        required: true

jobs:
  republish:
    name: Republish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      # Pre-release security check: never publish unless every check in
      # .github/required-checks.json passed on this exact SHA.
      - name: Require green checks on the republished commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/require-green.mjs "$GITHUB_SHA"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Restore Bun dependency cache
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: actions/cache/restore@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install Dependencies
        run: bun install

      - name: Build Packages (no cache)
        run: npx turbo build --force

      - name: Configure npm auth
        run: |
          export NPM_TOKEN="${{ secrets.NPM_TOKEN }}"
          ./scripts/npm-auth.sh
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Resolve workspace dependencies
        run: ./scripts/resolve-workspace-deps.sh

      - name: Publish packages
        run: |
          INPUT="${{ github.event.inputs.packages }}"

          # All publishable packages
          ALL_PKGS="packages/core packages/types packages/sdk packages/cli packages/sdk-react-native"

          if [ "$INPUT" = "all" ]; then
            PKGS="$ALL_PKGS"
          else
            # Convert comma-separated names to paths
            PKGS=""
            IFS=',' read -ra NAMES <<< "$INPUT"
            for name in "${NAMES[@]}"; do
              name=$(echo "$name" | xargs) # trim whitespace
              # Handle both "@openkey/sdk" and "sdk" formats
              name="${name#@openkey/}"
              if [ -d "packages/$name" ]; then
                PKGS="$PKGS packages/$name"
              else
                echo "Warning: packages/$name not found, skipping"
              fi
            done
          fi

          for pkg in $PKGS; do
            if [ ! -f "$pkg/package.json" ]; then
              continue
            fi

            pkg_name=$(jq -r '.name' "$pkg/package.json")
            pkg_version=$(jq -r '.version' "$pkg/package.json")
            is_private=$(jq -r '.private // false' "$pkg/package.json")

            if [ "$is_private" = "true" ]; then
              echo "Skipping $pkg_name (private)"
              continue
            fi

            # A prerelease version (0.13.0-beta.4) is published under its own tag (beta), never latest;
            # a stable version is published under latest.
            tag=latest
            case "$pkg_version" in
              *-*) tag="${pkg_version#*-}"; tag="${tag%%.*}" ;;
            esac
            if ! [[ "$tag" =~ ^[a-z][a-z0-9-]*$ ]]; then
              echo "Cannot derive an npm tag from $pkg_name@$pkg_version"
              exit 1
            fi

            echo "Publishing $pkg_name@$pkg_version with tag $tag..."
            cd "$pkg"
            npm publish --access public --tag "$tag" 2>&1 || echo "  Failed or already published"
            cd "$GITHUB_WORKSPACE"
          done
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
