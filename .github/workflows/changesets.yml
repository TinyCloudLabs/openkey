name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Build Packages
        run: npx turbo build --force

      - name: Check for publishable changesets
        id: check
        env:
          # On CI the status text is colored ("\e[32mNO\e[39m packages"), so a
          # plain-text grep never matched and every push tried to open a
          # version PR instead of publishing (TC-647).
          NO_COLOR: "1"
        run: |
          echo "Changeset files:"
          ls .changeset/*.md | grep -v '/README.md$' || echo "  (none)"
          bun changeset status
          # Decide from the release plan, not the text: ignored packages
          # (api, web, db, tee) are left out of `releases`.
          bun changeset status --output=changeset-status.json
          echo "Planned releases:"
          jq -r '.releases[] | "  \(.name) \(.oldVersion) -> \(.newVersion) (\(.type))"' changeset-status.json
          releases=$(jq '.releases | length' changeset-status.json)
          rm -f changeset-status.json
          if [ "$releases" -eq 0 ]; then
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
            echo "No publishable changesets — will attempt to publish if versions are unpublished"
          else
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
            echo "Found publishable changesets — will create version PR"
          fi

      - name: Create Release Pull Request
        if: steps.check.outputs.has_changesets == 'true'
        uses: changesets/action@v1
        with:
          version: bun changeset version
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Publish to npm
        if: steps.check.outputs.has_changesets == 'false'
        # `changeset publish` tags each package it publishes but leaves the
        # tags local; push them so every npm release has a git tag (TC-681).
        # Existing tags were fetched at checkout, so only new ones are sent.
        # The tags are annotated, which needs a committer identity; without one
        # `git tag` fails and changesets still logs "New tag" (TC-723).
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bun run publish
          git push origin --tags
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

