name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Restore Bun dependency cache
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install Dependencies
        run: bun install

      - name: Build Packages
        run: npx turbo build --force

      - name: Check for publishable changesets
        id: check
        env:
          # On CI the status text is colored ("\e[32mNO\e[39m packages"), so a
          # plain-text grep never matched and every push tried to open a
          # version PR instead of publishing (TC-647).
          NO_COLOR: "1"
        run: |
          echo "Changeset files:"
          ls .changeset/*.md | grep -v '/README.md$' || echo "  (none)"
          bun changeset status
          # Decide from the release plan, not the text: ignored packages
          # (api, web, db, tee) are left out of `releases`.
          bun changeset status --output=changeset-status.json
          echo "Planned releases:"
          jq -r '.releases[] | "  \(.name) \(.oldVersion) -> \(.newVersion) (\(.type))"' changeset-status.json
          releases=$(jq '.releases | length' changeset-status.json)
          rm -f changeset-status.json
          if [ "$releases" -eq 0 ]; then
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
            echo "No publishable changesets — will attempt to publish if versions are unpublished"
          else
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
            echo "Found publishable changesets — will create version PR"
          fi

      # changesets/action v1 treated every directory in .changeset/ as a
      # version-1 changeset and opened <dir>/changes.md. Changesets 3 keeps
      # the changesets it has already versioned in .changeset/pre/, so v1
      # failed with ENOENT on .changeset/pre/changes.md whenever a publishable
      # changeset was waiting. v2 dropped the version-1 support and reads the
      # layout this repo's @changesets/cli 3 writes. Pinned to the v2.1.2 commit.
      - name: Create Release Pull Request
        if: steps.check.outputs.has_changesets == 'true'
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: bun changeset version
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          github-token: ${{ secrets.GH_TOKEN }}
          push-with-git-cli: true

      - name: Publish to npm
        if: steps.check.outputs.has_changesets == 'false'
        # `changeset publish` tags each package it publishes but leaves the
        # tags local; push them so every npm release has a git tag (TC-681).
        # Existing tags were fetched at checkout, so only new ones are sent.
        # The tags are annotated, which needs a committer identity; without one
        # `git tag` fails and changesets still logs "New tag" (TC-723).
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bun run publish
          git push origin --tags
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # One GitHub Release per published package version, on the tag the step
      # above just pushed: notes from the package CHANGELOG, prerelease for
      # betas, "latest" only for a stable @openkey/sdk. Idempotent, and
      # re-running on the same commit retries a Release that failed.
      - name: Create GitHub Releases
        run: node scripts/release/create-github-releases.mjs --points-at-head
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
