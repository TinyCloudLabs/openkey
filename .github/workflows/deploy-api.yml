# Deploys are manual: `gh workflow run deploy-api.yml --ref main`, run by the release coordinator.
# Rollback: `gh run rerun <last good run>`.
name: Deploy API to Phala Cloud

on:
  workflow_dispatch:
    inputs:
      preflight_only:
        description: Inspect serving instances, rollback image, and migration state without changes
        type: boolean
        default: false

concurrency:
  group: production-api
  cancel-in-progress: false

env:
  DOCKER_IMAGE: skgbafa/openkey-api
  # Production dstack OS the openkey-api CVM must run (the Phala KMS only releases app keys to this image).
  PHALA_OS_IMAGE: dstack-0.5.12
  PHALA_OS_IMAGE_HASH: 8db40cb23008d6213668b5816702d100b37b859a8a5bfd18d938ae3a1b3715bd

jobs:
  preflight:
    if: github.ref == 'refs/heads/main' && inputs.preflight_only
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Install Phala CLI
        run: npm install -g phala@1.1.22
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Restore Bun dependency cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Prepare read-only inspector
        run: |
          bun install --frozen-lockfile
          bun run db:generate
      - name: Inspect production without changes
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bun scripts/inspect-api-production.ts

  deploy:
    if: github.ref == 'refs/heads/main' && !inputs.preflight_only
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      # Reads the Review path run for this commit and downloads its image artifact.
      actions: read
    steps:
      # Full history: the release note diffs the commit live in production against this one.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Phala CLI
        run: npm install -g phala@1.1.22

      # Fail closed before any production change if the CVM is not on the pinned production OS.
      # To fix it, set the OS by hand: `phala api -X PATCH /cvms/<id>/os-image -F os_image_name=dstack-0.5.12`.
      - name: Require production OS image on the CVM
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
        run: |
          set -euo pipefail
          os=$(phala cvms get openkey-api --api-token "$PHALA_CLOUD_API_KEY" --json | jq -c '.os')
          if ! jq -e --arg name "$PHALA_OS_IMAGE" --arg hash "$PHALA_OS_IMAGE_HASH" \
            '.is_dev == false and .name == $name and .os_image_hash == $hash' <<<"$os" >/dev/null; then
            echo "::error::openkey-api is not on the production OS image ${PHALA_OS_IMAGE} (${PHALA_OS_IMAGE_HASH}). Found: ${os}"
            echo "Set the OS first with PATCH /cvms/<id>/os-image (os_image_name=${PHALA_OS_IMAGE}), then re-run. CI does not change the OS." >&2
            exit 1
          fi

      # The one-line release note for this publish: the diff from the commit production reports on
      # /health to the commit being deployed. Fails open: "yes" whenever either commit is unknown.
      - name: Release note
        run: |
          live="$(curl -fsS --max-time 20 https://api.openkey.so/health | jq -r '.commit // empty' || true)"
          if [[ ! "$live" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "$live^{commit}" 2>/dev/null; then live=""; fi
          note="$(BASE="$live" HEAD="$GITHUB_SHA" node .github/scripts/review-path-scope.mjs note)" || note='touches sign-in/approval: yes (the note script failed, so assume it does)'
          echo "Release note: $note" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      # Build once, promote the same artifact: the image is the one review-path.yml built from this commit
      # and ran the Review path on. It is pushed under its commit tag only, never `latest`, and never rebuilt.
      # A commit tag already in the registry (a rollback rerun) is deployed as it is.
      - name: Find the image that passed the Review path
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$DOCKER_IMAGE:$GITHUB_SHA" > /dev/null 2>&1; then
            echo "$DOCKER_IMAGE:$GITHUB_SHA is already in the registry; deploying that image."
            exit 0
          fi
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow review-path.yml --branch main --event push \
            --commit "$GITHUB_SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -z "$run_id" ]; then
            echo "::error::No successful Review path run on main for $GITHUB_SHA, so there is no image to promote. Wait for the run on this commit, or deploy a commit whose run passed."
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download the image that passed the Review path
        if: steps.image.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: api-image-${{ github.sha }}
          run-id: ${{ steps.image.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/api-image

      - name: Push that image under its commit tag
        if: steps.image.outputs.run_id != ''
        run: |
          set -euo pipefail
          gunzip -c "$RUNNER_TEMP/api-image/api-image.tar.gz" | docker load
          docker image inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "openkey-api:$GITHUB_SHA" | grep -qx "GIT_SHA=$GITHUB_SHA" \
            || { echo "::error::the downloaded image was not built from $GITHUB_SHA"; exit 1; }
          docker tag "openkey-api:$GITHUB_SHA" "$DOCKER_IMAGE:$GITHUB_SHA"
          docker push "$DOCKER_IMAGE:$GITHUB_SHA"

      - name: Update compose with image tag
        run: |
          sed -i "s|\${DOCKER_IMAGE}|${{ env.DOCKER_IMAGE }}:${{ github.sha }}|g" docker-compose.prod.yml

      # Apply the tracked migrations before shipping the code. Raw migration SQL
      # installs custody and tenant-boundary guards that `prisma db push` omits.
      # The API container intentionally does not contain or run the schema engine.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Restore Bun dependency cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Deploy and verify production migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret not set; refusing to deploy without migrations" >&2
            exit 1
          fi
          bun install --frozen-lockfile
          bun run db:migrate:deploy:production

      - name: Deploy to Phala Cloud
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
        run: |
          phala deploy \
            --api-token "$PHALA_CLOUD_API_KEY" \
            --cvm-id openkey-api \
            --no-public-logs \
            --no-public-sysinfo \
            --no-dev-os \
            --image "$PHALA_OS_IMAGE" \
            --compose docker-compose.prod.yml \
            --wait

      # Fail closed if the deploy left the CVM on a different OS image.
      - name: Verify production OS image after deploy
        env:
          PHALA_CLOUD_API_KEY: ${{ secrets.PHALA_CLOUD_API_KEY }}
        run: |
          set -euo pipefail
          os=$(phala cvms get openkey-api --api-token "$PHALA_CLOUD_API_KEY" --json | jq -c '.os')
          if ! jq -e --arg name "$PHALA_OS_IMAGE" --arg hash "$PHALA_OS_IMAGE_HASH" \
            '.is_dev == false and .name == $name and .os_image_hash == $hash' <<<"$os" >/dev/null; then
            echo "::error::openkey-api is not on the production OS image ${PHALA_OS_IMAGE} (${PHALA_OS_IMAGE_HASH}) after deploy. Found: ${os}"
            exit 1
          fi

      - name: Record deployed commit
        run: |
          {
            echo "### Production API deployed"
            echo ""
            echo "Commit: [\`${GITHUB_SHA::7}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})"
            echo "Image: \`${{ env.DOCKER_IMAGE }}:${GITHUB_SHA}\` (built once by review-path.yml, not rebuilt here)"
            echo "Deployments: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/deployments/production"
          } >> "$GITHUB_STEP_SUMMARY"
