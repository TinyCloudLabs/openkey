name: Inspect TinyCloud Bootstrap

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type INSPECT_TINYCLOUD_BOOTSTRAP'
        required: true

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      CONFIRM_INSPECT: ${{ inputs.confirm }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Restore Bun dependency cache
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun node_modules/.bin/prisma generate --schema=./packages/db/prisma/schema.prisma

      - name: Inspect latest bootstrap states
        run: bun run scripts/ci-inspect-tinycloud-bootstrap.ts
