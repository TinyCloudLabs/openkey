name: Inspect TinyCloud Bootstrap

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type INSPECT_TINYCLOUD_BOOTSTRAP'
        required: true

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CONFIRM_INSPECT: ${{ inputs.confirm }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun node_modules/.bin/prisma generate --schema=./packages/db/prisma/schema.prisma

      - name: Inspect latest bootstrap states
        run: bun run scripts/ci-inspect-tinycloud-bootstrap.ts
