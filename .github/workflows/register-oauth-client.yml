name: Register OAuth Client

# Manually register a public (PKCE-only) OAuth client in the prod database, update
# the branding fields of an existing enabled client by setting client_id, or
# replace the native delegation ceiling of an existing native client by setting
# client_id together with tinycloud_native_delegation (dry run by default).
# OpenKey uses pre-registered clients only, and the prod ADMIN_API_KEY lives
# solely in the Phala CVM env — this workflow provides an auditable
# registration path using the same DATABASE_URL secret the deploy workflow's
# schema-sync step already uses. Client ids are public, so log output is safe.

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Application display name (shown on the consent screen)'
        required: false
      redirect_uris:
        description: 'Comma-separated allowed redirect URIs (required when creating a client)'
        required: false
      type:
        description: 'Client type'
        required: false
        type: choice
        options:
          - native
          - spa
      uri:
        description: 'Application website URL (optional)'
        required: false
      client_id:
        description: 'Existing enabled client ID to update (optional); branding only, unless tinycloud_native_delegation is also set'
        required: false
      icon:
        description: 'HTTPS icon URL (optional); on update, empty leaves unchanged and none clears'
        required: false
      theme_background_color:
        description: 'Brand background color as #rrggbb (optional); on update, empty leaves unchanged and none clears'
        required: false
      theme_accent_color:
        description: 'Brand accent color as #rrggbb (optional); on update, empty leaves unchanged and none clears'
        required: false
      tinycloud_native_delegation:
        description: 'Native delegation ceiling JSON (optional). With client_id it is the full replacement ceiling, e.g. {"version":1,"appId":"com.example.app","tinycloudHost":"https://tee.node.tinycloud.xyz","kv":{"paths":["com.example.app/data/"],"actions":["get","put"]},"sql":null}'
        required: false
      dry_run:
        description: 'Ceiling update only: the ceiling is written only when this is false; otherwise BEFORE, AFTER and the diff are printed and nothing is written (default true)'
        required: false
        type: boolean
        default: true
      allow_narrow:
        description: 'Ceiling update only: permit a ceiling that removes or reduces existing entries (default false)'
        required: false
        type: boolean
        default: false

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Restore Bun dependency cache
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: actions/cache/restore@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Register client
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLIENT_NAME: ${{ inputs.name }}
          CLIENT_REDIRECT_URIS: ${{ inputs.redirect_uris }}
          CLIENT_TYPE: ${{ inputs.type }}
          CLIENT_URI: ${{ inputs.uri }}
          CLIENT_ID: ${{ inputs.client_id }}
          CLIENT_ICON: ${{ inputs.icon }}
          CLIENT_THEME_BACKGROUND_COLOR: ${{ inputs.theme_background_color }}
          CLIENT_THEME_ACCENT_COLOR: ${{ inputs.theme_accent_color }}
          CLIENT_TINYCLOUD_NATIVE_DELEGATION: ${{ inputs.tinycloud_native_delegation }}
          DRY_RUN: ${{ inputs.dry_run }}
          ALLOW_NARROW: ${{ inputs.allow_narrow }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret not set" >&2
            exit 1
          fi
          bun install --frozen-lockfile
          bun node_modules/.bin/prisma generate --schema=./packages/db/prisma/schema.prisma
          # dry_run and allow_narrow apply to ceiling updates (client_id with a ceiling) only.
          # The script writes a ceiling only with --apply, passed only when dry_run is exactly "false".
          args=()
          if [ -n "$CLIENT_ID" ] && [ -n "$CLIENT_TINYCLOUD_NATIVE_DELEGATION" ]; then
            if [ "$DRY_RUN" = "false" ]; then args+=(--apply); fi
            if [ "$ALLOW_NARROW" = "true" ]; then args+=(--allow-narrow); fi
          fi
          bun run scripts/ci-register-oauth-client.ts "${args[@]}"
