# Pre-release security check. Every job always runs (no paths filter) and fails
# closed, so each can be a required check (docs/security/required-checks.md), and
# deploy-api.yml / changesets.yml refuse to ship a commit where any is not green.
#
# - gitleaks: a pull request scans only its own commits; a push to main scans the
#   whole history against the reviewed baseline (.gitleaksignore, by fingerprint)
#   and .gitleaks.toml (allowlists for values public by construction). Rotate a
#   leaked value; never baseline it.
# - Web artifact audit: the exact Cloudflare Pages build (`bun run build --filter
#   @openkey/web`, which ends in `bun run audit:web`).
# - API image scan: builds the API image from the Dockerfile and runs trivy against
#   the baseline .trivyignore.yaml, so only a NEW fixable CRITICAL/HIGH fails.
name: Pre-release security

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned gitleaks
        run: node scripts/security/install-tool.mjs gitleaks "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: Scan the pull request's commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::missing base/head SHA" >&2; exit 1; }
          gitleaks git --config .gitleaks.toml --log-opts="${BASE_SHA}..${HEAD_SHA}" --redact --no-banner --exit-code 1 .

      - name: Scan the full history
        if: github.event_name != 'pull_request'
        run: gitleaks git --config .gitleaks.toml --redact --no-banner --exit-code 1 .

  web-artifact:
    name: Web artifact audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Test the audit script
        run: node --test scripts/security/audit-artifact.test.mjs .github/scripts/require-green.test.mjs

      # The Cloudflare Pages build command; it fails on an audit finding.
      - name: Build the web as Cloudflare Pages does, then audit it
        run: bun run build --filter @openkey/web

  api-image:
    name: API image scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Same Dockerfile and build args as deploy-api.yml; reads its layer cache, never writes it.
      - name: Build the API image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          push: false
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=openkey-api-image
          tags: openkey-api:scan

      - name: Scan the API image
        run: scripts/security/scan-image.sh openkey-api:scan
