# Tests ops/db-monitor/ (TC-3067) against real PostgreSQL service containers: for a database owned by a superuser and
# for one owned by a role that is not (a managed Postgres owner), provision, post-checks, deliberate deviations
# the post-checks must catch, drop, and "nothing left". Then against the full Prisma schema: migrations applied,
# the monitor provisioned and dropped, and Prisma's drift check clean throughout. No secrets, no production
# database: the provision workflow itself is manual-only (provision-db-monitor-role.yml).
name: DB monitor role tests

on:
  pull_request:
    paths:
      - 'ops/db-monitor/**'
      - '.github/workflows/db-monitor-role-test.yml'
      - '.github/workflows/provision-db-monitor-role.yml'
  push:
    branches:
      - main
    paths:
      - 'ops/db-monitor/**'
      - '.github/workflows/db-monitor-role-test.yml'
      - '.github/workflows/provision-db-monitor-role.yml'

permissions:
  contents: read

jobs:
  test:
    name: DB monitor role (postgres:${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '15', '17']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_PGHOST: localhost
      TEST_PGPORT: '5432'
      TEST_PGUSER: postgres
      TEST_PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age

      - name: Tool versions
        run: |
          psql --version
          age --version
          PGPASSWORD=postgres psql -h localhost -U postgres -At -c "SHOW server_version"

      - name: Provision, post-checks, deviations, drop, nothing left
        run: ops/db-monitor/test.sh

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Against the full Prisma schema
        run: ops/db-monitor/test-migrated.sh
