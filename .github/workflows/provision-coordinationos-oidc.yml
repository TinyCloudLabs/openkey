name: Provision CoordinationOS OIDC

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PROVISION_COORDINATIONOS_OIDC'
        required: true

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CONFIRM_PROVISION: ${{ inputs.confirm }}
      COORDINATIONOS_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.COORDINATIONOS_SUPABASE_SERVICE_ROLE_KEY }}
      COORDINATIONOS_URI: https://8b352f69cfac167160dc42b828f0b21ec764644d-8000.gateway.attestmesh.xyz
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENKEY_ISSUER: https://api.openkey.so/api/auth
      SUPABASE_CALLBACK_URI: https://poclfqqfyvbknxrvsauf.supabase.co/auth/v1/callback
      SUPABASE_URL: https://poclfqqfyvbknxrvsauf.supabase.co
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun node_modules/.bin/prisma generate --schema=./packages/db/prisma/schema.prisma

      - name: Provision OpenKey client and Supabase provider
        run: |
          test -n "$DATABASE_URL"
          test -n "$COORDINATIONOS_SUPABASE_SERVICE_ROLE_KEY"
          bun run scripts/ci-provision-coordinationos-oidc.ts
