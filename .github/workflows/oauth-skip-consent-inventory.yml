name: OAuth Skip-Consent Inventory

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type inventory exactly'
        required: true
        type: string

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check typed confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "inventory" ]; then
            echo "Confirmation did not match; inventory was not run" >&2
            exit 1
          fi

      - name: Print skip-consent OAuth clients
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PGOPTIONS: -c default_transaction_read_only=on
        run: |
          psql "$DATABASE_URL" --no-psqlrc --set ON_ERROR_STOP=1 --quiet -A -F ',' <<'SQL'
          BEGIN READ ONLY;
          SELECT "name", "clientId", "createdAt"
          FROM "oauth_client"
          WHERE "skipConsent" IS TRUE
          ORDER BY "createdAt";
          COMMIT;
          SQL
