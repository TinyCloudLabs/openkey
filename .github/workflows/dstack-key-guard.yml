# Every sealed user wallet and Nostr key is encrypted under a key derived from
# dstack `GetKey`. This fails a change to the dstack SDK version, the client, or
# the derivation unless the known answer in
# packages/tee/tests/dstack-key-derivation.kat.test.ts still holds (TC-964).
# The Dockerfile runs the same test, so a production image can't be built
# without it either.
name: dstack key-derivation guard

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  known-answer:
    name: dstack key-derivation known answer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Known-answer test
        run: bun test packages/tee/tests/dstack-key-derivation.kat.test.ts
