# Every sealed user wallet and Nostr key is encrypted under a key derived from
# dstack `GetKey`. This fails a change to the dstack SDK version, the client, or
# the derivation unless the known answer in
# packages/tee/tests/dstack-key-derivation.kat.test.ts still holds (TC-964).
# The Dockerfile runs the same test, so a production image can't be built
# without it either. The second job proves the API refuses to start in
# production unless TEE_MODE=production, instead of sealing with the mock
# TEE client (TC-966).
name: dstack key-derivation guard

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  known-answer:
    name: dstack key-derivation known answer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # The test also checks the built package, which is what the image runs.
      - name: Build @openkey/tee
        run: bun run --cwd packages/tee build

      - name: Known-answer test
        run: bun test packages/tee/tests/dstack-key-derivation.kat.test.ts
        env:
          OPENKEY_KAT_REQUIRE_DIST: '1'

  tee-mode:
    name: TEE mode fails closed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # The startup test runs the real API entry point, which loads the built
      # @openkey/db and @openkey/tee packages.
      - name: Build packages
        run: |
          bun run db:generate
          bun run build --filter @openkey/db --filter @openkey/tee

      - name: TEE mode tests
        run: bun test packages/tee/tests/tee-mode.test.ts apps/api/src/__tests__/tee-mode-startup.test.ts
