# Runs the whole API unit suite in one `bun test` process, the way a developer
# runs it. Files share bun's module registry there, so a module mock that leaks
# out of one file breaks another; apps/api/src/__tests__/mock-module.ts scopes
# mocks to their file (TC-928). No secrets, database, or network services.
name: API tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  api-tests:
    name: API test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # The API imports @openkey/db and @openkey/tee from their built dist/,
      # and @openkey/db needs the generated Prisma client.
      - name: Build packages
        run: |
          bun run db:generate
          bun run build --filter @openkey/db --filter @openkey/tee

      - name: API tests
        run: bun test apps/api/src/__tests__

      - name: Migration deploy and schema contract tests
        run: bun test scripts/deploy-production-migrations.test.ts packages/db/src/schema-contract.test.ts
