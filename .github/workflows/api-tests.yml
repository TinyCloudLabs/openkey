# Runs the whole API unit suite in one `bun test` process, the way a developer
# runs it. Files share bun's module registry there, so a module mock that leaks
# out of one file breaks another; apps/api/src/__tests__/mock-module.ts scopes
# mocks to their file (TC-928). No secrets, database, or network services.
name: API tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  api-tests:
    name: API test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # TC-2212 proves the exact lockstep source combination without publishing
      # an unreleased codec or putting a development path in production manifests.
      - name: Checkout immutable approval codec source
        uses: actions/checkout@v4
        with:
          repository: TinyCloudLabs/js-sdk
          ref: 63fd3a7de34d3b6f364430eb8a82caa803c7f659
          path: .tc2212-sdk
          persist-credentials: false

      - name: Build and pack approval codec
        working-directory: .tc2212-sdk
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run --cwd packages/share-envelope build
          codec_dir=$(mktemp -d -p /var/tmp TC2212-codec-XXXXXX)
          echo "TC-2212 codec artifact directory: $codec_dir"
          echo "TC2212_CODEC_DIR=$codec_dir" >> "$GITHUB_ENV"
          npm pack --ignore-scripts --workspace packages/share-envelope --pack-destination "$codec_dir"

      - name: Install ephemeral approval codec
        run: bun add --no-save --ignore-scripts "$TC2212_CODEC_DIR/tinycloud-share-envelope-1.3.1-beta.1.tgz"

      # The API imports @openkey/db and @openkey/tee from their built dist/,
      # and @openkey/db needs the generated Prisma client. The tests that drive
      # the signing pages' own code load @openkey/capability-review from its dist/.
      - name: Build packages
        run: |
          bun run db:generate
          bun run build --filter @openkey/db --filter @openkey/tee --filter @openkey/capability-review

      - name: API tests
        run: bun test apps/api/src/__tests__ scripts/deploy-production-migrations.test.ts

      # The capability review and web lib tests use the package built above.
      - name: Capability review and web lib tests
        run: bun test packages/capability-review/test apps/web/src/lib
