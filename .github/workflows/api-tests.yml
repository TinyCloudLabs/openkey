# Runs the whole API unit suite in one `bun test` process, the way a developer
# runs it. Files share bun's module registry there, so a module mock that leaks
# out of one file breaks another; apps/api/src/__tests__/mock-module.ts scopes
# mocks to their file (TC-928). No secrets. The only service is a throwaway
# Postgres container, used by the real-Postgres grant-lock tests (TC-1518 F-C).
name: API tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  api-tests:
    name: API test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OPENKEY_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # The API imports @openkey/db and @openkey/tee from their built dist/,
      # and @openkey/db needs the generated Prisma client.
      - name: Build packages
        run: |
          bun run db:generate
          bun run build --filter @openkey/db --filter @openkey/tee

      - name: API tests
        run: bun test apps/api/src/__tests__

      - name: Ethereum key access lint
        run: bun scripts/lint-ethereum-key-access.ts

      - name: Ethereum key access lint tests
        run: bun test scripts/lint-ethereum-key-access.test.ts

      - name: Migration deploy and schema contract tests
        run: bun test scripts/deploy-production-migrations.test.ts packages/db/src/schema-contract.test.ts
