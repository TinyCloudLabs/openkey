# Runs the whole API unit suite in one `bun test` process, the way a developer
# runs it. Files share bun's module registry there, so a module mock that leaks
# out of one file breaks another; apps/api/src/__tests__/mock-module.ts scopes
# mocks to their file (TC-928). The api-tests job uses no secrets, database, or
# network services. The renewal-lease-postgres job adds one throwaway Postgres,
# only for the lease lock and race cases PGlite (a single connection) cannot
# show (TC-2946).
name: API tests

on:
  pull_request:
  push:
    branches:
      - main
      - feat/tc-2212-openkey-sol61

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api-tests:
    name: API test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # Mirror the Dockerfile check so a migration PR missing the schema
      # contract fails during review rather than the deploy image build.
      - name: DB schema contract
        run: bun test packages/db/src/schema-contract.test.ts

      # The API imports @openkey/db and @openkey/tee from their built dist/,
      # and @openkey/db needs the generated Prisma client. The tests that drive
      # the signing pages' own code load @openkey/capability-review from its dist/,
      # and the approval pages' texts from @openkey/sdk/approval-copy.
      - name: Build packages
        run: |
          bun run db:generate
          bun run build --filter @openkey/db --filter @openkey/tee --filter @openkey/capability-review --filter @openkey/sdk

      - name: API tests
        run: bun test apps/api/src/__tests__ scripts/deploy-production-migrations.test.ts scripts/deploy-production-migrations-lock-timeout.test.ts scripts/inspect-api-production.test.ts scripts/oauth-client-branding.test.ts scripts/oauth-client-website.test.ts scripts/step-up-ceiling-parity.test.ts scripts/compose-image-digests.test.ts scripts/measured-app-compose.test.ts

      # TC-3569: OpenKey's step-up ceilings against the ones TinyCloud One's framed apps ask for, entry for entry.
      # Reads One's file at the commit pinned in scripts/step-up-ceilings/one.pin.json from the public tinychat
      # repository (no secret). A null pin fails the step (--require-pin): the step-up flag waits for the pin.
      - name: Step-up ceiling parity with TinyCloud One
        run: bun scripts/step-up-ceiling-parity.ts --require-pin

      # The capability review and web lib tests use the package built above.
      - name: Capability review and web lib tests
        run: bun test packages/capability-review/test apps/web/src/lib

      # The SDK tests import @openkey/core and @openkey/types from their dist/.
      - name: SDK tests
        run: |
          bun run build --filter @openkey/core --filter @openkey/types
          bun test packages/sdk

  renewal-lease-postgres:
    name: Renewal lease tests on Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build packages
        run: |
          bun run db:generate
          bun run build --filter @openkey/db --filter @openkey/tee --filter @openkey/capability-review --filter @openkey/sdk

      # Each run creates and drops its own database on this throwaway server.
      - name: Renewal lease tests (PGlite and Postgres)
        env:
          OPENKEY_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
        run: bun test apps/api/src/__tests__/renewal-lease-stop.integration.test.ts

      # One email code must sign in exactly once and every wrong guess must cost an attempt when the
      # verifications arrive together on separate connections, which PGlite cannot show.
      - name: Email code verification race (PGlite and Postgres)
        env:
          OPENKEY_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
        run: bun test apps/api/src/__tests__/email-otp-verify-race.integration.test.ts

      # The production migration deploy sets lock_timeout=5s on its migration connections through the URL.
      # Proves on Postgres 16 that Prisma honours it: a migration blocked by a held lock fails with 55P03.
      - name: Production migration lock timeout (Prisma on Postgres)
        env:
          OPENKEY_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
        run: bun test scripts/deploy-production-migrations-lock-timeout.test.ts
