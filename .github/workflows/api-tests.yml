# Runs the whole API unit suite in one `bun test` process, the way a developer
# runs it. Files share bun's module registry there, so a module mock that leaks
# out of one file breaks another; apps/api/src/__tests__/mock-module.ts scopes
# mocks to their file (TC-928). No secrets, database, or network services.
name: API tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  api-tests:
    name: API test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # The API imports @openkey/db and @openkey/tee from their built dist/,
      # and @openkey/db needs the generated Prisma client. The tests that drive
      # the signing pages' own code load @openkey/capability-review from its dist/.
      - name: Build packages
        run: |
          bun run db:generate
          bun run build --filter @openkey/db --filter @openkey/tee --filter @openkey/capability-review

      - name: API tests
        run: bun test apps/api/src/__tests__

      - name: Migration deploy and schema contract tests
        run: bun test scripts/deploy-production-migrations.test.ts packages/db/src/schema-contract.test.ts

      # The capability review and web lib tests use the package built above.
      - name: Capability review and web lib tests
        run: bun test packages/capability-review/test apps/web/src/lib

      - name: Personal-key custody access checks
        run: |
          bun scripts/lint-ethereum-key-access.ts
          bun test scripts/lint-ethereum-key-access.test.ts

  org-registration-postgres:
    name: Organization registration PostgreSQL race
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: s1b_fixture
          POSTGRES_PASSWORD: s1b_fixture
          POSTGRES_DB: s1b_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U s1b_fixture -d s1b_fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      TEE_MODE: development
      DATABASE_URL: postgresql://s1b_fixture:s1b_fixture@127.0.0.1:5432/s1b_fixture
      BETTER_AUTH_URL: https://api.openkey.test
      BETTER_AUTH_SECRET: org-registration-postgres-fixture-secret
      CORS_ORIGIN: https://openkey.so
      HOME: ${{ runner.temp }}/org-registration/home
      TC_HOME: ${{ runner.temp }}/org-registration/tc
      COURIER_HOME: ${{ runner.temp }}/org-registration/courier
      TMPDIR: ${{ runner.temp }}/org-registration/tmp
      XDG_CACHE_HOME: ${{ runner.temp }}/org-registration/cache
      BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/org-registration/bun-cache
      npm_config_cache: ${{ runner.temp }}/org-registration/npm-cache
    steps:
      - uses: actions/checkout@v4
      - name: Prepare private fixture roots
        run: mkdir -p "$HOME" "$TC_HOME" "$COURIER_HOME" "$TMPDIR" "$XDG_CACHE_HOME" "$BUN_INSTALL_CACHE_DIR" "$npm_config_cache"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build packages
        run: |
          bun run db:generate
          bun run build --filter @openkey/db --filter @openkey/tee --filter @openkey/capability-review
      - name: PostgreSQL registration interleaving
        run: bun test apps/api/integration/org-registration-postgres.test.ts
