name: Share sender sign-in smoke

# TC-994. After OpenKey reaches production (the web widget through a completed
# production Cloudflare Pages check, the API through "Deploy API to Phala Cloud"),
# a new throwaway OpenKey account signs in to production Share, creates a share and
# opens it. TC-688 broke every Share sender for a week because no OpenKey
# release check exercised an embedding app.
on:
  check_run:
    types: [completed]
  workflow_run:
    workflows: ["Deploy API to Phala Cloud"]
    types: [completed]
  workflow_dispatch:
    inputs:
      share_ref:
        description: Share branch or tag that provides the smoke
        default: main
  workflow_call:
    inputs:
      share_ref:
        description: Share branch or tag that provides the smoke
        type: string
        default: main

permissions:
  contents: read
  checks: read

jobs:
  web-publication:
    name: Web publication status
    if: >-
      github.event_name == 'check_run' &&
      github.event.check_run.app.id == 85455 &&
      github.event.check_run.name == 'Cloudflare Pages: openkey' &&
      github.event.check_run.check_suite.head_branch == 'main' &&
      !contains(github.event.check_run.output.summary, 'Branch Preview URL')
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.publication.outputs.published }}
    steps:
      - uses: actions/checkout@v4
      - name: Require a published production web
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
          WEB_SHA: ${{ github.event.check_run.head_sha }}
        run: |
          set -euo pipefail
          state=$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/commits/${WEB_SHA}/check-runs?filter=all&per_page=100" \
            | node .github/scripts/share-web-publication.mjs "$WEB_SHA")
          case "$state" in
            published)
              echo "published=true" >> "$GITHUB_OUTPUT"
              echo "openkey.so web published for ${WEB_SHA}; running Share sender smoke" >> "$GITHUB_STEP_SUMMARY"
              ;;
            unpublished)
              echo "openkey.so web not published for ${WEB_SHA}; smoke runs when it is published" >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "openkey.so web deployment failed for ${WEB_SHA}" >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
          esac

  smoke:
    needs: web-publication
    if: >-
      !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
        needs.web-publication.outputs.published == 'true'
      )
    # Unrelated check_run events must not replace a queued production smoke.
    concurrency:
      group: share-sender-smoke
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Share smoke lockfile
        id: share-lock
        env:
          SHARE_REF: ${{ inputs.share_ref || 'main' }}
        run: |
          repo="$RUNNER_TEMP/share-smoke-source"
          git clone --quiet --depth 1 --branch "$SHARE_REF" \
            https://github.com/TinyCloudLabs/share.git "$repo"
          hash=$(sha256sum "$repo/package-lock.json" | cut -d ' ' -f 1)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
      - name: Cache Share npm dependencies
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ steps.share-lock.outputs.hash }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Pin Share smoke clone to the hashed snapshot
        run: git config --global url."file://${RUNNER_TEMP}/share-smoke-source".insteadOf https://github.com/TinyCloudLabs/share.git
      - name: Share sender sign-in smoke
        env:
          SHARE_REF: ${{ inputs.share_ref || 'main' }}
          SHARE_SMOKE_ARTIFACT: ${{ runner.temp }}/share-sender-smoke.json
          QA_MAIL_ADDRESS_SECRET: ${{ secrets.QA_MAIL_ADDRESS_SECRET }}
          QA_MAIL_READ_TOKEN: ${{ secrets.QA_MAIL_READ_TOKEN }}
        run: scripts/share-sender-smoke.sh
      - name: Keep the scrubbed report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: share-sender-smoke
          path: ${{ runner.temp }}/share-sender-smoke.json
          if-no-files-found: ignore
          retention-days: 14
