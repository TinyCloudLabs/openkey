name: Share sender sign-in smoke

# TC-994. After OpenKey reaches production (the web widget through Cloudflare
# Pages on push to main, the API through "Deploy API to Phala Cloud"), a new
# throwaway OpenKey account signs in to production Share, creates a share and
# opens it. TC-688 broke every Share sender for a week because no OpenKey
# release check exercised an embedding app.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Deploy API to Phala Cloud"]
    types: [completed]
  workflow_dispatch:
    inputs:
      share_ref:
        description: Share branch or tag that provides the smoke
        default: main

concurrency:
  group: share-sender-smoke
  cancel-in-progress: false

permissions:
  contents: read
  checks: read

jobs:
  smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the web widget to deploy this commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 60); do
            state=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" \
              --jq '[.check_runs[] | select(.name == "Cloudflare Pages: openkey")][0] | "\(.status) \(.conclusion)"')
            echo "Cloudflare Pages: openkey: ${state}"
            case "$state" in
              "completed success") exit 0 ;;
              "null null") ;;
              completed*) echo "openkey.so did not deploy ${GITHUB_SHA}"; exit 1 ;;
            esac
            sleep 20
          done
          echo "openkey.so did not finish deploying within 20 minutes"; exit 1
      - name: Resolve Share smoke lockfile
        id: share-lock
        env:
          SHARE_REF: ${{ inputs.share_ref || 'main' }}
        run: |
          repo="$RUNNER_TEMP/share-smoke-source"
          git clone --quiet --depth 1 --branch "$SHARE_REF" \
            https://github.com/TinyCloudLabs/share.git "$repo"
          hash=$(sha256sum "$repo/package-lock.json" | cut -d ' ' -f 1)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
      - name: Cache Share npm dependencies
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ steps.share-lock.outputs.hash }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Pin Share smoke clone to the hashed snapshot
        run: git config --global url."file://${RUNNER_TEMP}/share-smoke-source".insteadOf https://github.com/TinyCloudLabs/share.git
      - name: Share sender sign-in smoke
        env:
          SHARE_REF: ${{ inputs.share_ref || 'main' }}
          SHARE_SMOKE_ARTIFACT: ${{ runner.temp }}/share-sender-smoke.json
        run: scripts/share-sender-smoke.sh
      - name: Keep the scrubbed report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: share-sender-smoke
          path: ${{ runner.temp }}/share-sender-smoke.json
          if-no-files-found: ignore
          retention-days: 14
